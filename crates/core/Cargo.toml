[package]
name = "symbiote-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "symbiote"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
regex = "=1.12.2"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
libc = "=0.2.177"
