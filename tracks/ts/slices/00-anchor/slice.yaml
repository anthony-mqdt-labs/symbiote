id: 00-anchor
ring: 0
goal: "Implement formatCents: integer cents → \"$12.34\" / \"-$1.05\""
target_files: [src/money.ts, src/money.test.ts]
probe_cmd: "bun test src/money.test.ts"
static_checks: ["tsc -p ."]
hint: "Reject non-integers with Number.isInteger. Work on Math.abs(cents): dollars = Math.floor(abs / 100), cents part = String(abs % 100).padStart(2, \"0\"). Prefix \"-\" when negative."
lesson: |
  Money is integer cents; floats can't represent 0.1 exactly:
    0.1 + 0.2 === 0.30000000000000004
  Format from integers only:
    const abs = Math.abs(c);
    `${Math.floor(abs / 100)}.${String(abs % 100).padStart(2, "0")}`
trigger_words: ["integer cents", "floating-point error", "RangeError"]
say_this_not_that:
  - avoid: "I store money as numbers"
    say: "money is stored as integer cents and only formatted at the edge, so no floating-point rounding ever touches a balance"
story_template: "Balances drifted by fractions of a cent because amounts were stored as float dollars. I moved to integer cents with formatting only at the display edge, and tests pin negatives, zero padding, and rejection of non-integers."
concepts: [integer-money]
glossary:
  - term: Integer cents
    definition: "Representing money as a whole number of the smallest unit so arithmetic is exact."
    avoid: ["decimal dollars", "float money"]
tier0_drill:
  prompt: "In a bun REPL (bun repl), run 0.1 + 0.2 and 10 + 20. Then explain why the ledger uses the second form."
  quiz:
    question: "Why does the ledger store 1234 instead of 12.34?"
    options:
      - "Integers use less memory"
      - "Binary floats can't represent most decimal fractions exactly, so sums drift; integer cents stay exact"
      - "JSON can't encode decimals"
      - "TypeScript has no decimal type annotation"
    answer_index: 1
    explanation: "0.1 has no exact binary representation; integer arithmetic below 2^53 is exact."
