    slices: [01-discriminated-union, 02-parse-dont-validate, 03-typed-emitter]
  - ring: 2
    slug: read-defend
    goal: "Read existing code, find the broken invariant, defend the fix"
    slices: [04-replay-bug]
  - ring: 3
    slug: break-harden
    goal: "Hostile uploads: size limits, malformed JSON, prototype pollution"
    slices: [05-import-harden]
  - ring: 4
    slug: architect
    goal: "Pressure-test under /mock: event versioning, idempotency, schema evolution"
